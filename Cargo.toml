[package]
name = "molcrafts-molpack"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "Faithful Rust port of Packmol molecular packing (split off from molrs)"
repository = "https://github.com/MolCrafts/molpack"
homepage = "https://github.com/MolCrafts/molpack"
documentation = "https://docs.rs/molcrafts-molpack"
readme = "README.md"
keywords = ["packmol", "molecular-modeling", "chemistry", "simulation"]
categories = ["science", "algorithms"]
# Repo tooling, not crate content (python/ is its own package and is left out
# by cargo already).
exclude = [".cargo/", ".claude/", ".github/", ".pre-commit-config.yaml", "CLAUDE.md"]

[lib]
name = "molpack"

[dependencies]
# Path deps are for local development; `version` fields are used by
# `cargo publish` to resolve against the crates.io registry.
#
# Library-required. The `molcrafts-molrs` crate exposes its parts as
# feature-gated modules: `core` is always on, while `io` is opt-in via
# the molpack feature below. molrs's own default is just `rayon`; it is
# switched off here so parallelism stays molpack's own opt-in (the `rayon`
# feature below) and wasm / Pyodide builds work.
molrs = { path = "../molrs/molrs", version = "0.17", package = "molcrafts-molrs", default-features = false }
rand = "0.10"
ndarray = "0.17"
log = "0.4"

# Opt-in parallelism:
rayon = { version = "1.12", optional = true }

# CLI-only:
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = []
rayon = ["dep:rayon", "molrs/rayon"]
# Pulls in molrs's `io` module for the built-in script loader, example programs,
# and the molpack CLI. PyO3 / WASM front-ends typically leave this off and
# provide their own frame loader through `Script::lower` + `Target::from_frame_parts`.
io = ["molrs/io"]
# Enables the `molpack` binary.
cli = ["dep:clap", "io"]

[dev-dependencies]
# Used by the example programs under `examples/`.
env_logger = "0.11"
# The optimizer-seam tests bind a real molrs force-field optimizer (`Lbfgs` over
# `ff::potential::soft::SoftSpec`); a caller does the same on its own molrs
# dependency, so the library itself has no `ff` feature.
molrs = { path = "../molrs/molrs", version = "0.17", package = "molcrafts-molrs", default-features = false, features = ["ff"] }

[[bin]]
name = "molpack"
path = "src/bin/molpack/main.rs"
required-features = ["cli"]

# Example programs read and write their files through molrs's `io`, so they
# need the `io` feature on. Run with `cargo run --example <name> --features io`.
[[example]]
name = "pack_peo"
path = "examples/pack_peo/main.rs"
required-features = ["io"]

[[example]]
name = "pack_mixture"
path = "examples/pack_mixture/main.rs"
required-features = ["io"]

[[example]]
name = "pack_bilayer"
path = "examples/pack_bilayer/main.rs"
required-features = ["io"]

[[example]]
name = "pack_interface"
path = "examples/pack_interface/main.rs"
required-features = ["io"]

[[example]]
name = "pack_solvprotein"
path = "examples/pack_solvprotein/main.rs"
required-features = ["io"]

[[example]]
name = "pack_spherical"
path = "examples/pack_spherical/main.rs"
required-features = ["io"]

# Polymer adsorption onto a substrate: a heterogeneous system whose chains relax
# their conformation in-loop via `TorsionMcOptimizer`. Synthesizes its own
# coarse-grain geometry; `io` is for molrs's XYZ writer (the optional dump).
[[example]]
name = "pack_adsorption"
path = "examples/pack_adsorption/main.rs"
required-features = ["io"]

# Polymer translocation initial state: chains threaded through a membrane pore —
# a configuration MD cannot reach from an unthreaded start. `io` is for molrs's
# XYZ writer (the optional dump).
[[example]]
name = "pack_translocation"
path = "examples/pack_translocation/main.rs"
required-features = ["io"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
