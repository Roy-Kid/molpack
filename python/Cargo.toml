[package]
name = "molpack-python"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "Python bindings for molpack molecular packing"
repository = "https://github.com/MolCrafts/molpack"
homepage = "https://github.com/MolCrafts/molpack"

[lib]
name = "molpack_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.17"
molpack = { path = "..", package = "molcrafts-molpack", version = "0.4.0" }
# Same crate (and version) molpack links, so frame types unify across the wheel.
# Defaults off (molrs's default turns on `rayon`); the wheel's own `rayon`
# feature turns it back on through molpack.
molrs = { path = "../../molrs/molrs", package = "molcrafts-molrs", version = "0.16", default-features = false }
# Stable FFI handle layer. molpack resolves molrs Python objects (`Frame`,
# regions) to `molrs_ffi::{FrameRef, RegionRef}` capsules (zero-copy) instead
# of dict marshalling — see `src/molrs_capsule.rs`. Minor-line pinned (minor-line =
# ABI version): the handle types and the `molrs::core::Frame` they lend share one
# layout within a minor line, independent of features (path+version managed
# manually, per project convention).
molrs-ffi = { path = "../../molrs/molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.16", default-features = false }
# Direct rayon dep so the binding can introspect/configure the global pool
# (`num_threads`, `init_thread_pool`); shares the same process-global pool
# molpack's parallel evaluator runs on. Gated behind the `rayon` feature.
rayon = { version = "1.12", optional = true }

# Standalone package — not a member of any outer workspace.
[workspace]

# Standalone workspace root: does not inherit the root manifest's release
# profile, so the keys are restated here — keep the two in step so released
# wheels get the same optimisation as a local release build.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

[features]
# Forward the parallel evaluator into the wheel. Enabling this compiles the
# rayon code paths in molpack (and `molrs/rayon`); without it the binding's
# `with_parallel_eval(True)` raises instead of silently no-op'ing.
rayon = ["dep:rayon", "molpack/rayon"]
