[package]
name = "molpack-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "Python bindings for molpack molecular packing"
repository = "https://github.com/MolCrafts/molpack"
homepage = "https://github.com/MolCrafts/molpack"

[lib]
name = "molpack_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.17"
molpack = { path = "..", package = "molcrafts-molpack", version = "0.2.0" }
# Same crate (and version) molpack links, so frame types unify across the wheel.
# On molrs's default feature union (matching molpack's dependency and molrs's own
# binders) — the shared-dylib precondition: a single differing feature would give
# this extension its own molrs image instead of the process-wide shared one.
molrs = { path = "../../molrs/molrs", package = "molcrafts-molrs", version = "0.14" }
# Stable FFI handle layer. molpack resolves molrs/molpy Python objects to
# `molrs_ffi::{FrameRef, ForceFieldRef}` capsules (zero-copy) instead of dict
# marshalling — see `src/interop.rs`. Minor-line pinned (minor-line = ABI
# version): the handle types and the `molrs::Frame` they lend share one layout
# within a minor line (path+version managed manually, per project convention).
molrs-ffi = { path = "../../molrs/molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.14" }
# Direct rayon dep so the binding can introspect/configure the global pool
# (`num_threads`, `init_thread_pool`); shares the same process-global pool
# molpack's parallel evaluator runs on. Gated behind the `rayon` feature.
rayon = { version = "1.12", optional = true }

# Standalone package — not a member of any outer workspace.
[workspace]

# Standalone workspace root: does NOT inherit ../Cargo.toml's [profile.release].
# These four keys are byte-identical across the seven native roots listed in
# ../../molrs/scripts/sync-dylib-locks.sh's ROOTS array, so released wheels get
# the same optimization — profile is part of cargo's unit fingerprint, and a
# mismatch would put two libmolrs_ffi builds behind the one hashless install_name
# that @rpath resolves at runtime.
#
# LTO is on because static is the default link form; the opt-in dynamic form has
# to turn it off, since a Rust dylib in a cdylib's graph makes rustc reject LTO.
# The how lives in ../../molrs/docs/interop.md, nowhere else.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

[features]
# The force-field relaxer (`ff`) is a mandatory part of the wheel — the Python
# API (`LBFGSRelaxer`, `Target.with_relaxer`) always ships. Build it plain:
# `maturin develop` / `maturin build` need no extra flags.
default = ["ff"]
# Forward the parallel evaluator into the wheel. Enabling this compiles the
# rayon code paths in molpack (and `molrs/rayon`); without it the binding's
# `with_parallel_eval(True)` raises instead of silently no-op'ing.
rayon = ["dep:rayon", "molpack/rayon"]
# Force-field relaxer: pulls molrs's `ff` module into the wheel (MMFF94/MMFF94s + L-BFGS +
# the LAMMPS force-field reader / `to_potentials`) and exposes `LBFGSRelaxer` +
# `Target.with_relaxer` for relaxation-assisted packing.
ff = ["molpack/ff", "molrs/ff", "molrs-ffi/ff"]
