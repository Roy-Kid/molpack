[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "molcrafts-molpack"
version = "0.4.0"
description = "Python bindings for molpack molecular packing (Packmol port)"
requires-python = ">=3.12"
readme = "README.md"
license = "BSD-3-Clause"
# Minor-line pin — same major.minor as molrs; patch may drift.
dependencies = [
  "numpy>=2.0",
  "molcrafts-molrs>=0.16.0,<0.17",
]

# Installable "extra" carrying the docs-build deps. Unlike the [dependency-groups]
# doc group below (dev/CI-only, installs deps but not the package), an extra ships
# in the wheel metadata, so a *prebuilt-wheel* install pulls it with no Rust build:
#   pip install "molcrafts-molpack[doc]"
# That is the build command a Cloudflare Pages Git-integration build should use.
[project.optional-dependencies]
doc = [
  "zensical>=0.0.53",
  "molcrafts-zensical-theme>=0.2.5",
]

# PEP 735 dependency groups — the single source of truth for dev-time
# deps used by both CI jobs and local pre-commit hooks.
#
# Install with `pip install --group <name>` (pip 25.1+) from this directory.
[dependency-groups]
typecheck = [
  "ruff",
  "ty",
  "numpy>=2.0",
  "molcrafts-molrs>=0.16.0,<0.17",
  # `ty check` walks tests/ which imports pytest.
  "pytest",
]
test = [
  "pytest",
  "numpy>=2.0",
  "molcrafts-molrs>=0.16.0,<0.17",
]
dev = [
  {include-group = "typecheck"},
  {include-group = "test"},
  "maturin",
  # Gate driver (prek pre-push / CI): install with `uv sync --group dev`
  # then `uv run --group dev tox -c python -e py` from repo root, or
  # `uv run --group dev tox -e py` from python/.
  "tox>=4.23",
]
# Documentation build: `zensical build` reads zensical.toml (docs → site).
# Theme: `theme.name = "molcrafts"` (molcrafts-zensical-theme on PyPI).
doc = [
  "zensical>=0.0.53",
  # The molcrafts docs theme (zensical.toml sets `theme.name = "molcrafts"`).
  "molcrafts-zensical-theme>=0.2.5",
]

[project.urls]
Homepage = "https://github.com/MolCrafts/molpack"
Repository = "https://github.com/MolCrafts/molpack"

[tool.maturin]
python-source = "python"
module-name = "molpack.molpack"
features = ["rayon"]
exclude = [
  "python/molpack/*.so",
  "python/molpack/*.dylib",
  "python/molpack/*.dll",
  "python/molpack/*.dSYM",
  "python/molpack/*.dSYM/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["python", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
]
ignore = [
  "E501", # line too long — enforced by formatter, not linter
]

[tool.ruff.lint.isort]
known-first-party = ["molpack"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
molcrafts-molrs = { path = "../../molrs/molrs-python", editable = true }

[tool.ty]
[tool.ty.environment]
python-version = "3.12"
# tests import example scripts via sys.path.insert at runtime; ty cannot follow
# dynamic path manipulation, so we declare the examples dir as an extra source root.
extra-paths = ["examples"]

# Isolated binding tests — prek pre-push + CI call: `tox -c python -e py`
# Non-editable only: sibling molrs path install + maturin wheel + pytest.
# Requires ../../molrs on the 0.16.* minor line. The hooks and CI both run it
# in a layout whose ../../molrs is the commit scripts/partners.py resolves.
# Both builds are --locked (MATURIN_PEP517_ARGS reaches the molrs wheel).
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["py"]
no_package = true

[tool.tox.env.py]
description = "throwaway env: non-editable molrs + molpack wheel + pytest"
base_python = ["python3.12"]
deps = [
  "maturin>=1.0,<2.0",
  "pytest",
  "numpy>=2.0",
]
pass_env = [
  "HOME",
  "PATH",
  "CARGO_HOME",
  "CARGO_TARGET_DIR",
  "RUSTUP_HOME",
  # Standard cargo variable, none of ours: passed through so a developer's own
  # flags (e.g. `-C target-cpu=native` for a bench build) survive tox's clean
  # env. Nothing in this repo sets it; `lto` lives in `[profile.release]` in
  # the manifests, where tox cannot strip it.
  "RUSTFLAGS",
  # sccache (CI compile cache) — harmless when unset locally.
  "RUSTC_WRAPPER",
  "SCCACHE_GHA_ENABLED",
  "SCCACHE_PATH",
  "ACTIONS_RESULTS_URL",
  "ACTIONS_RUNTIME_TOKEN",
  "MACOSX_DEPLOYMENT_TARGET",
  "SSH_AUTH_SOCK",
  "TERM",
]
set_env = { MATURIN_PEP517_ARGS = "--locked" }
allowlist_externals = ["maturin"]
# toxinidir is python/ when config lives here; sibling molrs is ../.. /molrs.
# Minor-line only: 0.16.* (patch may differ).
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import tomllib; from pathlib import Path; p=Path('{toxinidir}')/'..'/'..'/'molrs'/'Cargo.toml'; v=tomllib.loads(p.read_text())['workspace']['package']['version']; assert tuple(map(int, v.split('.')[:2]))==(0,16), f'sibling molrs {{v}} not on 0.16.*'",
  ],
  [
    "{envpython}",
    "-m",
    "pip",
    "install",
    "{toxinidir}/../../molrs/molrs-python",
  ],
  [
    "{envpython}",
    "-c",
    "import importlib.metadata as m; v=m.version('molcrafts-molrs'); assert tuple(map(int, v.split('.')[:2]))==(0,16), v",
  ],
  ["maturin", "build", "--release", "--locked", "-o", "{env_tmp_dir}/wheels"],
  [
    "{envpython}",
    "-c",
    "from pathlib import Path; import subprocess, sys; w=next(Path(r'{env_tmp_dir}/wheels').glob('molcrafts_molpack-*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(w)])",
  ],
  [
    "{envpython}",
    "-c",
    "import molpack, pathlib; r=pathlib.Path(molpack.__file__).resolve(); assert 'site-packages' in str(r), r",
  ],
]
commands = [
  ["{envpython}", "-m", "pytest", "-v"],
]
