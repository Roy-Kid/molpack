# Share the sibling molrs repo's build cache. The sibling checkout is already
# mandatory (Cargo.toml path deps on ../molrs/molrs), and CI checks out molrs
# at the same relative location (see .github/workflows/ci.yml), so one cache
# serves both repos and molrs compiles once per (rustc, features, profile).
# Covers both the root workspace and python/ (its own workspace root) via
# cargo's upward config discovery. CARGO_TARGET_DIR (env) still overrides.
[build]
target-dir = "../molrs/target"

# Local default = DYNAMIC: every non-wasm build prefers the shared
# libmolrs_ffi dylib (one molrs image per process). wasm32 is exempt via
# the cfg. CI/publish override back to today's static form with
#   RUSTFLAGS='-C prefer-dynamic=no'  +  CARGO_PROFILE_RELEASE_LTO=thin
# (env RUSTFLAGS replaces these flags entirely).
[target.'cfg(not(target_arch = "wasm32"))']
rustflags = ["-C", "prefer-dynamic"]
