version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: cargo
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
