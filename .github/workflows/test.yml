name: test

# Rust and Python tests against molrs at the commit scripts/partners.py
# resolves, in two tiers (`tier` decides):
#
#   fast  a feature-branch push to MolCrafts: the Rust tests, and the Python
#         suite on Linux.
#   full  everything else -- dev/master, pull requests, tags (release.yml),
#         dispatches, and every push to a fork, so a fork branch is proven
#         before its pull request is opened: the Python suite on Linux, macOS
#         and Windows.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  # uv builds molrs and molpack through maturin's PEP 517 hook; this makes
  # those cargo builds --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  tier:
    name: test / tier
    # A pull request inside a fork was already built by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        run: echo "full=${{ !(github.repository_owner == 'MolCrafts' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master') }}" | tee -a "$GITHUB_OUTPUT"

  # Behaviour lives in `#[cfg(test)]` modules next to the code (no tests/
  # directory); every other target and feature set still has to compile.
  rust:
    name: test / rust
    needs: tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-partners
      - uses: ./.github/actions/setup-rust
        with:
          cache: rust
          workspaces: . -> ../molrs/target
      - run: |
          cargo test --locked --lib --features cli
          cargo test --locked --doc --features cli
          cargo check --locked --all-targets --features cli
          cargo check --locked --no-default-features
          cargo check --locked --features rayon

  # tox -e py: the wheel built isolated and installed non-editable.
  python:
    name: test / python (${{ matrix.os }})
    needs: tier
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-partners
      - uses: ./.github/actions/setup-rust
        with:
          cache: python
          workspaces: . -> ../molrs/target
      - run: uv run --locked --python 3.12 --directory python --group dev tox -e py
