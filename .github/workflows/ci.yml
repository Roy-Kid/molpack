name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_call:
  workflow_dispatch:

# Local builds use the sibling directories. GitHub has two branches, and
# CI checks out MolCrafts/molrs and MolCrafts/molpy on that same branch.
# A pull request uses its head branch.
env:
  MOLRS_GIT_REPOSITORY: MolCrafts/molrs
  MOLPY_GIT_REPOSITORY: MolCrafts/molpy
  MOL_GIT_REF: ${{ github.head_ref || github.ref_name }}
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

# Lint: same as prek commit-stage hooks in .pre-commit-config.yaml.
# Tests: same commands as prek pre-push hooks (no scripts/).

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLRS_GIT_REPOSITORY }}
          ref: ${{ env.MOL_GIT_REF }}
          path: molrs
      # `ty check` walks examples/, which import molpy (typecheck group).
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLPY_GIT_REPOSITORY }}
          ref: ${{ env.MOL_GIT_REF }}
          path: molpy
      - uses: actions/checkout@v6
        with:
          path: molpack
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      # The committed .cargo/config.toml routes builds into ../molrs/target,
      # shared with the sibling molrs checkout.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "molpack -> ../molrs/target"
      - uses: astral-sh/setup-uv@v6
      - name: Rust fmt + clippy (pre-commit parity)
        working-directory: molpack
        run: |
          set -euo pipefail
          # Package roots only (avoid path-dep molrs noise from `cargo fmt --all`).
          cargo fmt -- --check
          cargo fmt --manifest-path python/Cargo.toml -- --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: No ignored tests (pre-commit parity)
        working-directory: molpack
        run: |
          ! git grep -nE '```[a-z,_]*ignore|#\[ignore' -- src docs examples python/src
      - name: Ruff + ty (pre-commit parity)
        working-directory: molpack
        run: |
          set -euo pipefail
          # Paths relative to python/ (matches local `cd python && ty check …`).
          uv run --directory python --group typecheck ruff format --check python tests examples
          uv run --directory python --group typecheck ruff check python tests examples
          uv run --directory python --group typecheck ty check python tests examples

  test:
    name: rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLRS_GIT_REPOSITORY }}
          ref: ${{ env.MOL_GIT_REF }}
          path: molrs
      - uses: actions/checkout@v6
        with:
          path: molpack
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      # The committed .cargo/config.toml routes builds into ../molrs/target,
      # shared with the sibling molrs checkout.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "molpack -> ../molrs/target"
      - name: Rust tests
        working-directory: molpack
        run: |
          set -euo pipefail
          # Behaviour lives in `#[cfg(test)]` modules next to the code; there is
          # no tests/ directory (see CLAUDE.md).
          cargo test --lib --features cli,ff
          cargo test --doc --features cli,ff
          # Every other target still has to compile: bin, examples.
          cargo check --all-targets --features cli,ff
          cargo check --no-default-features
          cargo check --features rayon

  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLRS_GIT_REPOSITORY }}
          ref: ${{ env.MOL_GIT_REF }}
          path: molrs
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLPY_GIT_REPOSITORY }}
          ref: ${{ env.MOL_GIT_REF }}
          path: molpy
      - uses: actions/checkout@v6
        with:
          path: molpack
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      # The committed .cargo/config.toml routes builds into ../molrs/target,
      # shared with the sibling molrs checkout.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "molpack -> ../molrs/target"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: tox -e py via python dev group (isolated, non-editable)
        working-directory: molpack
        run: uv run --directory python --group dev tox -e py
