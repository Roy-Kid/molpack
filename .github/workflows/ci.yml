name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_call:
  workflow_dispatch:

# MolCrafts/molrs and MolCrafts/molpy are checked out next to molpack at the
# commits .github/partners.env pins -- the one place those pins live; the
# publish workflows and the pre-push hooks (scripts/partners.py) read the same
# file. Every command here has a hook in .pre-commit-config.yaml.
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: molpack
      - name: Partner pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' molpack/.github/partners.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLRS_REPOSITORY }}
          ref: ${{ env.MOLRS_REF }}
          path: molrs
      # `ty check` walks examples/, which import molpy (typecheck group).
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLPY_REPOSITORY }}
          ref: ${{ env.MOLPY_REF }}
          path: molpy
      # The toolchain molpack/rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: molpack
      - uses: mozilla-actions/sccache-action@v0.0.9
      # The committed .cargo/config.toml routes builds into ../molrs/target,
      # shared with the sibling molrs checkout.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "molpack -> ../molrs/target"
      - uses: astral-sh/setup-uv@v7
      # File hygiene, ruff, rustfmt and the no-ignored-tests guard: the
      # pre-commit stage of .pre-commit-config.yaml, on every file.
      - name: Commit hooks (pre-commit parity)
        working-directory: molpack
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: Partner pins and path dependencies (pre-push parity)
        working-directory: molpack
        run: python3 scripts/partners.py check
      - name: Lock files (pre-push parity)
        working-directory: molpack
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path python/Cargo.toml >/dev/null
          uv lock --check --directory python
      - name: clippy (pre-push parity)
        working-directory: molpack
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: ty (pre-push parity)
        working-directory: molpack
        run: uv run --locked --python 3.12 --directory python --group typecheck ty check python tests examples

  test:
    name: rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: molpack
      - name: Partner pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' molpack/.github/partners.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLRS_REPOSITORY }}
          ref: ${{ env.MOLRS_REF }}
          path: molrs
      - run: rustup toolchain install
        working-directory: molpack
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "molpack -> ../molrs/target"
      - name: Rust tests
        working-directory: molpack
        run: |
          set -euo pipefail
          # Behaviour lives in `#[cfg(test)]` modules next to the code; there is
          # no tests/ directory (see CLAUDE.md).
          cargo test --locked --lib --features cli,ff
          cargo test --locked --doc --features cli,ff
          # Every other target still has to compile: bin, examples.
          cargo check --locked --all-targets --features cli,ff
          cargo check --locked --no-default-features
          cargo check --locked --features rayon

  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: molpack
      - name: Partner pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' molpack/.github/partners.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLRS_REPOSITORY }}
          ref: ${{ env.MOLRS_REF }}
          path: molrs
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLPY_REPOSITORY }}
          ref: ${{ env.MOLPY_REF }}
          path: molpy
      - run: rustup toolchain install
        working-directory: molpack
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "molpack -> ../molrs/target"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: tox -e py via python dev group (isolated, non-editable)
        working-directory: molpack
        run: uv run --locked --python 3.12 --directory python --group dev tox -e py

  # The docs site from the `doc` group, --strict: any warning fails. Same as
  # the pre-push hook.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: molpack
      - name: Partner pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' molpack/.github/partners.env >> "$GITHUB_ENV"
      # Metadata only: `--locked` checks python/uv.lock, whose path sources
      # are these checkouts. Nothing compiles.
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLRS_REPOSITORY }}
          ref: ${{ env.MOLRS_REF }}
          path: molrs
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.MOLPY_REPOSITORY }}
          ref: ${{ env.MOLPY_REF }}
          path: molpy
      - uses: astral-sh/setup-uv@v7
      - working-directory: molpack
        run: uv run --isolated --locked --python 3.12 --project python --only-group doc zensical build --clean --strict
