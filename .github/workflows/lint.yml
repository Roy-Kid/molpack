name: lint

# Format, linters, type checks and lock files, against molrs at the commit
# scripts/partners.py resolves (molrs's dev, or its branch named like this
# one), and the workflows against the CI scheme (check-workflows). Same in
# every context; see "CI" in CONTRIBUTING.md.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: lint / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  # The commit-stage hooks on every file (hygiene, ruff, rustfmt, no ignored
  # tests), the partners check and the three lock files. Nothing compiles.
  hooks:
    name: lint / hooks
    # A pull request inside a fork was already run by its push.
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - run: python3 scripts/partners.py check
      - run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path python/Cargo.toml >/dev/null
          uv lock --check --directory python

  # clippy, and ty over the Python package (builds the extension).
  clippy:
    name: lint / clippy
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    env:
      MATURIN_PEP517_ARGS: --locked
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      # .cargo/config.toml routes every build into ../molrs/target.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          cache: lint
          workspaces: . -> ../molrs/target
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: uv run --locked --python 3.12 --directory python --group typecheck ty check python tests examples

  workflows:
    name: lint / workflows
    needs: context
    # Every workflow against the CI scheme: MolCrafts/molcrafts-ci/actions/check-workflows.
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@master
