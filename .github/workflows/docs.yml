name: docs

# The site from the `doc` group, --strict: any warning fails. Cloudflare Pages
# deploys it from MolCrafts itself (its Git integration), so no job here
# deploys.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: docs / build
    # A pull request inside a fork was already run by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      # `--locked` checks python/uv.lock, whose path sources are ../molrs.
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@master
      - run: uv run --isolated --locked --python 3.12 --project python --only-group doc zensical build --clean --strict
